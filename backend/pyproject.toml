[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonstudies-lunar-data"
version = "0.2.0"
description = "Extracción puntual reproducible de LOLA LDEM, LDRM y pendiente derivada"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "pvl>=1.3.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
geospatial = ["rasterio>=1.5.2,<2", "tifffile>=2026.11.12"]

[project.scripts]
lunar-data = "lunar_data.__main__:main"

[tool.setuptools.packages.find]
where = ["processing"]
include = ["lunar_data*"]

[tool.pytest.ini_options]
testpaths = ["tests/lunar"]
addopts = "-ra"
markers = ["local_data: comprobaciones con los IMG originales, si están disponibles"]
